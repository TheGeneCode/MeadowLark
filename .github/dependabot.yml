# Dependabot covers GitHub Actions and the Python lockfile. The pinned FFmpeg build in
# .github/ffmpeg-pin.yml is bumped by ffmpeg-bump.yml, not Dependabot, because BtbN's builds are
# release assets rather than a package ecosystem Dependabot can read.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    # One PR for all action bumps, so ci.yml and release.yml move together.
    groups:
      actions:
        patterns: ["*"]
  # Python dependencies (pyproject.toml + uv.lock). Grouped so one PR moves the lockfile at a time.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    # bgutil is excluded from the group: the plugin must move with the vendored server
    # (vendor/bgutil-pot-provider/), which Dependabot cannot do, so its bump comes as a
    # PR of its own that tests/test_pot_provider_pin.py turns red. Do the vendor move on
    # that PR's branch (see "Updating the pin" in its README); the rest of the group
    # stays mergeable.
    groups:
      python:
        patterns: ["*"]
        exclude-patterns: ["bgutil-ytdlp-pot-provider"]
