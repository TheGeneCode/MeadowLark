version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    # One PR for all action bumps, so ci.yml and release.yml move together.
    groups:
      actions:
        patterns: ["*"]
