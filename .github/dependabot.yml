# Dependabot covers GitHub Actions and the Python lockfile. The pinned FFmpeg build in
# .github/ffmpeg-pin.yml is bumped by ffmpeg-bump.yml, not Dependabot, because BtbN's builds are
# release assets rather than a package ecosystem Dependabot can read.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    # One PR for all action bumps, so ci.yml and release.yml move together.
    groups:
      actions:
        patterns: ["*"]
  # Python dependencies (pyproject.toml + uv.lock). Grouped so one PR moves the lockfile at a time.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
    # The plugin hard-fails on a major mismatch with the vendored server script
    # (vendor/bgutil-pot-provider/), so a major bump must move both together by hand
    # (see "Updating the pin" in its README). Drop this ignore once that upgrade lands.
    ignore:
      - dependency-name: "bgutil-ytdlp-pot-provider"
        update-types: ["version-update:semver-major"]
