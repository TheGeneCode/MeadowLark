name: Release
on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          uv version $version

      - name: Install dependencies (incl. dev group for PyInstaller)
        run: uv sync --group dev

      - name: Install package in editable mode (required for copy_metadata in spec)
        run: uv pip install -e .

      - name: Set up PO-token provider (deno install)
        run: uv run python scripts/setup_pot_provider.py --skip-warm

      - name: Build executable
        run: uv run pyinstaller meadowlark.spec

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter "bin" -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)\ffmpeg.exe"  dist\MeadowLark\
          Copy-Item "$($bin.FullName)\ffprobe.exe" dist\MeadowLark\

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$version `
            installer\setup.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: installer_output/MeadowLark-Setup-*.exe
